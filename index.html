<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QA Log Insight</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
       /* Custom scrollbar for log viewer */
       textarea::-webkit-scrollbar {
        width: 10px;
        background-color: #0f172a;
      }
      textarea::-webkit-scrollbar-thumb {
        background-color: #334155;
        border-radius: 5px;
      }
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fade-in 0.3s ease-in-out;
      }
      .animate-fade-in-up {
        animation: fade-in-up 0.4s ease-out;
      }
      
      @media print {
        body {
          background-color: white !important;
          color: black !important;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        /* Ensure background colors in severity badges print correctly if possible */
        .print\:bg-slate-50 { background-color: #f8fafc !important; }
        .print\:bg-white { background-color: #ffffff !important; }
        .print\:text-black { color: #000000 !important; }
        .print\:hidden { display: none !important; }
        
        /* Hide scrollbars in print */
        ::-webkit-scrollbar {
            display: none;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.1"
  }
}
</script>
</head>
  <body class="bg-slate-950">
    <div id="root"></div>
  </body>
</html>
